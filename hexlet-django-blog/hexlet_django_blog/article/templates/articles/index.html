{% extends "base.html" %}

{% block content %}
    <h1>Список статей</h1>

    <a href="{% url 'articles_create' %}">+ Создать новую статью</a>

    {% for article in articles %}
        <h2>
            <a href="{% url 'article' id=article.id %}">{{ article.name }}</a>
        </h2>
        <div>{{ article.body|slice:":200" }}</div>
    {% empty %}
      <p>Статей пока нет.</p>
    {% endfor %}
{% endblock %}
